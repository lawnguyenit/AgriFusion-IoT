; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-n16r8]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
lib_ldf_mode = deep+
build_flags = 
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue
	-DARDUINO_USB_CDC_ON_BOOT=1
	-I${platformio.packages_dir}/framework-arduinoespressif32/libraries/LittleFS/src
	-I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
lib_deps = 
	LittleFS
	4-20ma/ModbusMaster@^2.0.1
	adafruit/Adafruit SHT31 Library@^2.2.2
	paulstoffregen/OneWire@^2.3.8
	SPI
	Wire
	bblanchon/ArduinoJson@^7.4.2
	mobizt/Firebase ESP32 Client@^4.4.17


; ---------------------------------------------------------------------------
; Probe / diagnostic environments. Each extends the production env and only
; adds a -D flag, so Config.h is never edited to switch modes. Probe sources
; live in tools/probes/ and are visible to the library finder via lib_extra_dirs.
; ---------------------------------------------------------------------------
[probe_base]
extends = env:esp32-s3-n16r8
lib_extra_dirs = tools/probes

[env:probe_sht30]
extends = probe_base
build_flags = ${env:esp32-s3-n16r8.build_flags}
	-DAPP_SHT30_TEST_MODE=1

[env:probe_ds18b20]
extends = probe_base
build_flags = ${env:esp32-s3-n16r8.build_flags}
	-DAPP_DS18B20_TEST_MODE=1

[env:probe_soil_moisture]
extends = probe_base
build_flags = ${env:esp32-s3-n16r8.build_flags}
	-DAPP_SOIL_MOISTURE_TEST_MODE=1

[env:probe_all_sensors]
extends = probe_base
build_flags = ${env:esp32-s3-n16r8.build_flags}
	-DAPP_ALL_SENSORS_TEST_MODE=1

[env:probe_raw_truth]
extends = probe_base
build_flags = ${env:esp32-s3-n16r8.build_flags}
	-DAPP_RAW_TRUTH_PROBE_MODE=1

[env:probe_sim_pure]
extends = probe_base
build_flags = ${env:esp32-s3-n16r8.build_flags}
	-DAPP_SIM_PURE_TEST_MODE=1

[env:probe_npk_matrix]
extends = probe_base
build_src_filter = -<*> +<../tools/probes/NpkMatrixTest/entry/main.cpp>
