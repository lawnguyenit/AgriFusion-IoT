name: frontend

on:
  push:
    paths:
      - "Frontend/**"
      - "docs/contracts/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "Frontend/**"
      - "docs/contracts/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Contract test (node:test, no dependencies)
        working-directory: Frontend
        run: node --test test/*.test.js
      - name: Syntax check of dashboard modules
        working-directory: Frontend
        run: |
          for f in public/*.js; do node --check "$f"; done
