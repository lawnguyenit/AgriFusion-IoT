  - {protocol_stage_id: FINAL_E4_TRANSPORT_BATCH, environment_id: E3_TARGET_PREEXPOSED, visibility_status: EVALUATION_ONLY, fit_allowed: false, tuning_allowed: false, evaluation_allowed: true, unlock_stage_id: RQ2B_E3_REEVALUATION_BATCH}
  - {protocol_stage_id: FINAL_E4_TRANSPORT_BATCH, environment_id: E4_FUTURE_TARGET, visibility_status: EVALUATION_ONLY, fit_allowed: false, tuning_allowed: false, evaluation_allowed: true, unlock_stage_id: FINAL_E4_TRANSPORT_BATCH}

fold_policies:
  - fold_policy_id: E1_PRIMARY_7D_V1
    fold_policy_role: PRIMARY
    train_window_mode: EXPANDING
    initial_train_duration_days: 21
    validation_duration_days: 7
    test_duration_days: 7
    purge_3h_min: 180
    purge_8h_min: 480
    fold_policy_version: "2026-07-31.fold.v1"
  - fold_policy_id: E1_DIAGNOSTIC_5D_V1
    fold_policy_role: DIAGNOSTIC
    train_window_mode: EXPANDING
    initial_train_duration_days: 15
    validation_duration_days: 5
    test_duration_days: 5
    purge_3h_min: 180
    purge_8h_min: 480
    fold_policy_version: "2026-07-31.fold.v1"

threshold_fit_cohorts:
  - threshold_fit_cohort_id: E1_DISCOVERY_TRAIN_V1
    environment_id: E1
    start_time: "2026-04-01T00:00:00+07:00"
    end_time: "2026-04-22T00:00:00+07:00"
    membership_rule: "start_time <= sample_time < end_time"
    cohort_version: "2026-07-31.cohort.v1"

future_target_policy:
  environment_id: E4_FUTURE_TARGET
  activation_event: CONTRACT_FREEZE_COMPLETED
  membership_rule: "sample_time_utc > freeze_timestamp_utc and unassigned_to_E1_E2_E3 and same_telemetry_source_family and not_demo"
  freeze_timestamp_utc: null
  materialization_status: NOT_MATERIALIZED
  untouched_claim_allowed_before_materialization: false
  policy_version: "2026-07-31.future-target.v1"

