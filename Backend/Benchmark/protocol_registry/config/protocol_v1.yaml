  - {protocol_stage_id: RQ2A_E2_RELEASE, environment_id: E1, visibility_status: FULL, fit_allowed: true, tuning_allowed: false, evaluation_allowed: true, unlock_stage_id: CONTRACT_FROZEN}
  - {protocol_stage_id: RQ2A_E2_RELEASE, environment_id: E2, visibility_status: SOURCE_RELEASED, fit_allowed: true, tuning_allowed: false, evaluation_allowed: true, unlock_stage_id: RQ2A_E2_RELEASE}
