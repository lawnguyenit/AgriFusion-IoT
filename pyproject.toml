[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agrifusion-iot"
version = "0.1.0"
description = "AgriFusion IoT telemetry backend: ingestion and canonical preprocessing."
requires-python = ">=3.11"
dependencies = [
    "firebase-admin",
    "python-dotenv",
    "numpy>=1.26",
    "pandas>=2.2,<4",
    "pyarrow>=15",
    "PyYAML>=6",
]

[project.optional-dependencies]
# Benchmark / research lane (Backend/Benchmark).
research = [
    "scikit-learn",
    "joblib",
    "matplotlib",
    "xgboost",
]
dev = [
    "pytest>=8",
    "pandas-stubs",
]
# Not installed by default (tests that need them are skipped with a reason):
#   torch, pytabkit, skorch -> realmlp / ft_transformer builder tests.
#   pytorch-tabnet is not imported anywhere; add it with torch if needed.

[project.scripts]
agrifusion = "agrifusion.cli:main"

# Only the telemetry backend is packaged. `Backend/` (the Benchmark/research lane and its
# tests) is not installed: it is run from a repository checkout and imported from the repo
# root (`python -m Backend.Benchmark...`), where it imports the installed `agrifusion`.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["Backend/tests"]
