[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agrifusion-iot"
version = "0.1.0"
description = "AgriFusion IoT telemetry backend: ingestion and canonical preprocessing."
requires-python = ">=3.11"
dependencies = [
    "firebase-admin",
    "python-dotenv",
    "numpy>=1.26",
    "pandas>=2.2,<4",
    "pyarrow>=15",
    "PyYAML>=6",
]

[project.optional-dependencies]
# Research lane (research/agrifusion_research).
research = [
    "scikit-learn",
    "joblib",
    "matplotlib",
    "xgboost",
]
dev = [
    "pytest>=8",
    "pandas-stubs",
]
# Not installed by default (tests that need them are skipped with a reason):
#   torch, pytabkit, skorch -> realmlp / ft_transformer builder tests.
#   pytorch-tabnet is not imported anywhere; add it with torch if needed.

[project.scripts]
agrifusion = "agrifusion.cli:main"
agrifusion-research = "agrifusion_research.cli:main"

# Two import packages from one distribution:
#   agrifusion           src/agrifusion                telemetry backend (Layer0/Layer1)
#   agrifusion_research  research/agrifusion_research  benchmark/research lane; needs the
#                        `research` extra to run (`pip install -e ".[research]"`).
# Dependencies flow one way: agrifusion_research imports agrifusion, never the reverse.
[tool.setuptools.packages.find]
where = ["src", "research"]

[tool.setuptools.package-data]
agrifusion = ["publish/result.schema.json"]
agrifusion_research = ["**/*.yaml", "**/*.json", "**/*.csv"]

[tool.pytest.ini_options]
pythonpath = [".", "src", "research"]
testpaths = ["Backend/tests"]
